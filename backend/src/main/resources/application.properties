spring.application.name=prism
server.address=${PRISM_BIND:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${PRISM_DATABASE_URL:jdbc:h2:file:./data/prism;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=sa
spring.datasource.password=${PRISM_DB_PASSWORD:}
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true
server.tomcat.max-http-form-post-size=512KB
server.tomcat.max-swallow-size=512KB
prism.username=${PRISM_USERNAME:}
prism.password=${PRISM_PASSWORD:}
logging.level.studio.prism=INFO
