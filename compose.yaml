services:
  prism:
    build: .
    image: ${PRISM_IMAGE:-prism:local}
    ports:
      - "127.0.0.1:${PRISM_PORT:-8080}:8080"
    environment:
      PRISM_USERNAME: ${PRISM_USERNAME:?Set PRISM_USERNAME in .env}
      PRISM_PASSWORD: ${PRISM_PASSWORD:?Set a 12+ character PRISM_PASSWORD in .env}
      PRISM_DB_PASSWORD: ${PRISM_DB_PASSWORD:?Set PRISM_DB_PASSWORD in .env}
    volumes:
      - prism-data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
volumes:
  prism-data:
